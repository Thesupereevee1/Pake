name: Pake Builder

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Pake command (without 'pake')"
        required: true
        type: string
        default: "https://oplolabs.github.io/TowelWrap/ --name TowelWrap --keep-binaries"

      windows:
        description: "Build for Windows"
        required: false
        type: boolean
        default: true

      macos:
        description: "Build for macOS"
        required: false
        type: boolean
        default: true

      linux:
        description: "Build for Linux"
        required: false
        type: boolean
        default: true


# ============================================================
# WINDOWS
# ============================================================

jobs:
  windows:
    name: Build Windows
    if: ${{ inputs.windows }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Pake
        shell: pwsh
        run: |
          npm install -g pake-cli

          Write-Host ""
          Write-Host "Pake version:"
          pake --version

      - name: Run Pake
        shell: pwsh
        env:
          PAKE_COMMAND: ${{ inputs.command }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Building TowelWrap"
          Write-Host "Platform: Windows"
          Write-Host "======================================"
          Write-Host ""

          Write-Host "pake $env:PAKE_COMMAND"
          Write-Host ""

          Invoke-Expression "pake $env:PAKE_COMMAND"

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: TowelWrap-Windows
          path: |
            **/*.exe
            **/*.msi
          if-no-files-found: warn
          retention-days: 7


# ============================================================
# MACOS
# ============================================================

  macos:
    name: Build macOS
    if: ${{ inputs.macos }}
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Pake
        shell: bash
        run: |
          npm install -g pake-cli

          echo ""
          echo "Pake version:"
          pake --version

      - name: Run Pake
        shell: bash
        env:
          PAKE_COMMAND: ${{ inputs.command }}
        run: |
          set -e

          echo ""
          echo "======================================"
          echo "Building TowelWrap"
          echo "Platform: macOS"
          echo "======================================"
          echo ""

          echo "pake $PAKE_COMMAND"
          echo ""

          pake $PAKE_COMMAND

      - name: Upload macOS build
        uses: actions/upload-artifact@v6
        with:
          name: TowelWrap-macOS
          path: |
            **/*.dmg
            **/*.app
            **/*.pkg
          if-no-files-found: warn
          retention-days: 7


# ============================================================
# LINUX
# ============================================================

  linux:
    name: Build Linux
    if: ${{ inputs.linux }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Pake
        shell: bash
        run: |
          npm install -g pake-cli

          echo ""
          echo "Pake version:"
          pake --version

      - name: Run Pake
        shell: bash
        env:
          PAKE_COMMAND: ${{ inputs.command }}
        run: |
          set -e

          echo ""
          echo "======================================"
          echo "Building TowelWrap"
          echo "Platform: Linux"
          echo "======================================"
          echo ""

          echo "pake $PAKE_COMMAND"
          echo ""

          pake $PAKE_COMMAND

      - name: Upload Linux build
        uses: actions/upload-artifact@v6
        with:
          name: TowelWrap-Linux
          path: |
            **/*.AppImage
            **/*.deb
            **/*.rpm
            **/*.tar.gz
          if-no-files-found: warn
          retention-days: 7
