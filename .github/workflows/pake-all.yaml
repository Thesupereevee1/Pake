name: Build Pake App (All Platforms)

on:
  workflow_dispatch:
    inputs:
      command:
        description: "PAKE command (leave empty for default)"
        required: false
        default: ""

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]

    steps:
      # -----------------------
      # Checkout
      # -----------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------
      # Node + npm
      # -----------------------
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # -----------------------
      # Verify npm exists (comes with Node)
      # -----------------------
      - name: Verify npm
        run: |
          node -v
          npm -v

      # -----------------------
      # Install Pake via npm ONLY
      # -----------------------
      - name: Install Pake CLI
        run: npm install -g pake-cli

      # -----------------------
      # Debug
      # -----------------------
      - name: Debug environment
        run: |
          echo "Command input: ${{ inputs.command }}"
          pake -v || true

      # -----------------------
      # Build app (default OR custom command)
      # -----------------------
      - name: Build app
        shell: bash
        run: |
          set -e

          if [ -n "${{ inputs.command }}" ]; then
            echo "🚀 Running custom command"
            echo "${{ inputs.command }}"
            bash -c "${{ inputs.command }}"
          else
            echo "🧩 Running default build"

            pake https://every-verse-counts.netlify.app \
              --name "EveryVerseCounts" \
              --width 1200 \
              --height 780
          fi

      # -----------------------
      # Upload artifacts per OS
      # -----------------------
      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: "*.dmg"

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: "*.msi"

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            *.AppImage
            *.deb
