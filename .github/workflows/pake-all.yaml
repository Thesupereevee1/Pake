name: Build Pake App (Selectable Platforms)

on:
  workflow_dispatch:
    inputs:
      command:
        description: "PAKE command (optional, overrides default)"
        required: false
        default: ""

      macos:
        description: "Build macOS"
        type: boolean
        required: false
        default: true

      windows:
        description: "Build Windows"
        type: boolean
        required: false
        default: false

      linux:
        description: "Build Linux"
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: >
          ${{
            fromJSON(
              format(
                '[{0}{1}{2}]',
                inputs.macos == true && '"macos-latest",' || '',
                inputs.windows == true && '"windows-latest",' || '',
                inputs.linux == true && '"ubuntu-24.04",' || ''
              )
            )
          }}

    steps:
      # -----------------------
      # Validate selection
      # -----------------------
      - name: Validate platform selection
        shell: bash
        run: |
          if [ "${{ inputs.macos }}" != "true" ] && \
             [ "${{ inputs.windows }}" != "true" ] && \
             [ "${{ inputs.linux }}" != "true" ]; then
            echo "❌ You must select at least one platform (macOS, Windows, Linux)"
            exit 1
          fi

      # -----------------------
      # Checkout
      # -----------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------
      # Node + npm
      # -----------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Node/npm
        run: |
          node -v
          npm -v

      # -----------------------
      # Install Pake (npm ONLY)
      # -----------------------
      - name: Install Pake CLI
        run: npm install -g pake-cli

      # -----------------------
      # Debug
      # -----------------------
      - name: Debug
        run: pake -v || true

      # -----------------------
      # Build
      # -----------------------
      - name: Build app
        shell: bash
        run: |
          set -e

          if [ -n "${{ inputs.command }}" ]; then
            echo "🚀 Running custom command"
            bash -c "${{ inputs.command }}"
          else
            echo "🧩 Running default build"

            pake https://every-verse-counts.netlify.app \
              --name "EveryVerseCounts" \
              --width 1200 \
              --height 780 \
              --keep-binary
          fi

      # -----------------------
      # Upload artifacts
      # -----------------------

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: "*.dmg"

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: "*.msi"

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            *.AppImage
            *.deb
