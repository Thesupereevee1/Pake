name: Build Pake App (All Platforms)

on:
  workflow_dispatch:
    inputs:
      command:
        description: "PAKE command (optional full override)"
        required: false
        default: ""

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]

    steps:
      # -----------------------
      # Checkout
      # -----------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------
      # Node.js
      # -----------------------
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # -----------------------
      # Verify npm
      # -----------------------
      - name: Verify Node & npm
        run: |
          node -v
          npm -v

      # -----------------------
      # Linux dependencies (FIX FOR YOUR ERROR)
      # -----------------------
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # -----------------------
      # Install Pake CLI (npm only)
      # -----------------------
      - name: Install Pake CLI
        run: npm install -g pake-cli

      # -----------------------
      # Debug
      # -----------------------
      - name: Debug environment
        run: |
          echo "OS: ${{ matrix.os }}"
          echo "Command: ${{ inputs.command }}"
          pake -v || true

      # -----------------------
      # Build step
      # -----------------------
      - name: Build app
        shell: bash
        run: |
          set -e

          if [ -n "${{ inputs.command }}" ]; then
            echo "🚀 Running custom PAKE command"

            # IMPORTANT: run safely (no broken quoting issues)
            bash -c '${{ inputs.command }}'

          else
            echo "🧩 Running default build"

            pake https://every-verse-counts.netlify.app \
              --name "EveryVerseCounts" \
              --title "Every Verse Counts" \
              --width 1200 \
              --height 780 \
              --keep-binary
          fi

      # -----------------------
      # Upload artifacts
      # -----------------------

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            *.dmg
            *-binary
            *.app

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            *.msi
            *.exe

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            *.AppImage
            *.deb
            *-binary
