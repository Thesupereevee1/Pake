name: Build App With Pake CLI (Clean Stable)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        required: true
        default: "ui"
        type: choice
        options:
          - ui
          - cli

      platform:
        description: "Platform"
        required: true
        default: "macos-latest"
        type: choice
        options:
          - macos-latest
          - windows-latest
          - ubuntu-24.04

      url:
        description: "Website URL (UI mode)"
        required: false

      name:
        description: "App name (UI mode)"
        required: false

      version:
        description: "Version (UI mode)"
        required: false
        default: "dev"

      cli_command:
        description: "CLI args (CLI mode only, no 'pake')"
        required: false

jobs:
  build:
    name: Build (${{ inputs.platform }})
    runs-on: ${{ inputs.platform }}

    steps:
      # -----------------------
      # Checkout
      # -----------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------
      # Node 24 (future proof)
      # -----------------------
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # -----------------------
      # pnpm via corepack (no globals issues)
      # -----------------------
      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        run: corepack prepare pnpm@10.26.2 --activate

      # -----------------------
      # Rust (required for Tauri/Pake)
      # -----------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # -----------------------
      # Install dependencies
      # -----------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # -----------------------
      # Build CLI
      # -----------------------
      - name: Build CLI
        run: pnpm run cli:build

      # -----------------------
      # Debug (prevents hidden 127 issues)
      # -----------------------
      - name: Debug build output
        run: |
          echo "Node version:"
          node -v
          echo "PNPM version:"
          pnpm -v
          echo "Dist contents:"
          ls -R dist || echo "dist missing"

      # -----------------------
      # Build App
      # -----------------------
      - name: Build App
        shell: bash
        run: |
          set -e

          echo "Mode: ${{ inputs.mode }}"
          echo "Platform: ${{ inputs.platform }}"

          # -----------------------
          # CLI MODE (SAFE)
          # -----------------------
          if [ "${{ inputs.mode }}" == "cli" ]; then
            echo "🚀 CLI mode"

            if [ -z "${{ inputs.cli_command }}" ]; then
              echo "ERROR: cli_command is required"
              exit 1
            fi

            echo "Running CLI command safely:"
            echo "${{ inputs.cli_command }}"

            # SAFE EXECUTION (NO pake, NO eval)
            bash -c "${{ inputs.cli_command }}"
            exit 0
          fi

          # -----------------------
          # UI MODE
          # -----------------------
          echo "🧩 UI mode"

          if [ -z "${{ inputs.url }}" ] || [ -z "${{ inputs.name }}" ]; then
            echo "ERROR: url and name required"
            exit 1
          fi

          if [ ! -f dist/cli.js ]; then
            echo "ERROR: dist/cli.js not found"
            exit 1
          fi

          node dist/cli.js \
            "${{ inputs.url }}" \
            --name "${{ inputs.name }}-${{ inputs.version }}" \
            --width 1200 \
            --height 780

      # -----------------------
      # Upload artifacts
      # -----------------------
      - name: Upload macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: "*.dmg"

      - name: Upload Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: "*.msi"

      - name: Upload Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: |
            *.AppImage
            *.deb
