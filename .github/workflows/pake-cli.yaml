name: Pake Command Runner (Single Input)

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Paste FULL command here (cli or pake)"
        required: true

jobs:
  run:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Install BOTH tools so command always works
      - name: Enable npm tools
        run: |
          npm install -g pake-cli

      - name: Show command
        run: echo "${{ inputs.command }}"

      - name: Run command
        shell: bash
        run: |
          set -e

          echo "Executing raw command..."
          bash -c "${{ inputs.command }}"
