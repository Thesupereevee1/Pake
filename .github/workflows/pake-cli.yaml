name: Build App With Pake CLI

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.26.2"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode (ui or cli)"
        required: true
        default: "ui"
        type: choice
        options:
          - ui
          - cli

      platform:
        description: "Platform (UI mode only)"
        required: true
        default: "macos-latest"
        type: choice
        options:
          - macos-latest
          - windows-latest
          - ubuntu-24.04

      url:
        description: "Website URL (UI mode)"
        required: false

      name:
        description: "App name (UI mode)"
        required: false

      version:
        description: "Version (UI mode)"
        required: false
        default: "dev"

      cli_command:
        description: "FULL CLI command (CLI mode only)"
        required: false

jobs:
  build:
    name: Build (${{ inputs.platform }})
    runs-on: ${{ inputs.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install

      - name: Build CLI
        run: pnpm run cli:build

      - name: Setup mold (Linux only)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1

      - name: Build App
        shell: bash
        run: |
          echo "Mode: ${{ inputs.mode }}"
          echo "Platform: ${{ inputs.platform }}"

          # -------------------------
          # CLI MODE (POWER USER)
          # -------------------------
          if [ "${{ inputs.mode }}" == "cli" ]; then
            echo "🚀 Running CLI mode"

            if [ -z "${{ inputs.cli_command }}" ]; then
              echo "ERROR: cli_command is empty"
              exit 1
            fi

            echo "Running: ${{ inputs.cli_command }}"
            eval "${{ inputs.cli_command }}"
            exit 0
          fi

          # -------------------------
          # UI MODE (DEFAULT)
          # -------------------------
          echo "🧩 Running UI mode"

          if [ -z "${{ inputs.url }}" ] || [ -z "${{ inputs.name }}" ]; then
            echo "ERROR: url and name are required in UI mode"
            exit 1
          fi

          node dist/cli.js \
            "${{ inputs.url }}" \
            --name "${{ inputs.name }}-${{ inputs.version }}" \
            --width 1200 \
            --height 780

      # -------------------------
      # ARTIFACTS
      # -------------------------

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: |
            *.dmg

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: |
            *.msi

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: |
            *.AppImage
            *.deb
