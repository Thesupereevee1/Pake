name: Build App With Pake CLI (Modern Stable)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        required: true
        default: "ui"
        type: choice
        options:
          - ui
          - cli

      platform:
        description: "Platform"
        required: true
        default: "macos-latest"
        type: choice
        options:
          - macos-latest
          - windows-latest
          - ubuntu-24.04

      url:
        description: "Website URL (UI mode)"
        required: false

      name:
        description: "App name (UI mode)"
        required: false

      version:
        description: "Version (UI mode)"
        required: false
        default: "dev"

      cli_command:
        description: "CLI override (CLI mode only)"
        required: false

jobs:
  build:
    name: Build (${{ inputs.platform }})
    runs-on: ${{ inputs.platform }}

    steps:
      # -----------------------
      # 1. Checkout
      # -----------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------
      # 2. Node 24 (fixes future breakage)
      # -----------------------
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # -----------------------
      # 3. pnpm (no globals confusion)
      # -----------------------
      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@10.26.2 --activate

      # -----------------------
      # 4. Rust (required for Tauri/Pake)
      # -----------------------
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # -----------------------
      # 5. Install dependencies
      # -----------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # -----------------------
      # 6. Build CLI (your project step)
      # -----------------------
      - name: Build CLI
        run: pnpm run cli:build

      # -----------------------
      # 7. Debug output (prevents 127 mystery failures)
      # -----------------------
      - name: Debug build output
        run: |
          echo "Node:"
          node -v
          echo "PNPM:"
          pnpm -v
          echo "Dist folder:"
          ls -R dist || echo "NO dist folder found"

      # -----------------------
      # 8. Build App (CORE LOGIC)
      # -----------------------
      - name: Build App
        shell: bash
        run: |
          set -e

          echo "Mode: ${{ inputs.mode }}"
          echo "Platform: ${{ inputs.platform }}"

          # -----------------------
          # CLI MODE
          # -----------------------
          if [ "${{ inputs.mode }}" == "cli" ]; then
            echo "🚀 CLI mode"

            if [ -z "${{ inputs.cli_command }}" ]; then
              echo "ERROR: cli_command is required"
              exit 1
            fi

            echo "Running CLI command:"
            echo "${{ inputs.cli_command }}"

            eval "${{ inputs.cli_command }}"
            exit 0
          fi

          # -----------------------
          # UI MODE
          # -----------------------
          echo "🧩 UI mode"

          if [ -z "${{ inputs.url }}" ] || [ -z "${{ inputs.name }}" ]; then
            echo "ERROR: url and name required"
            exit 1
          fi

          if [ ! -f dist/cli.js ]; then
            echo "ERROR: dist/cli.js not found (build failed)"
            exit 1
          fi

          node dist/cli.js \
            "${{ inputs.url }}" \
            --name "${{ inputs.name }}-${{ inputs.version }}" \
            --width 1200 \
            --height 780

      # -----------------------
      # 9. Upload artifacts
      # -----------------------

      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: "*.dmg"

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: "*.msi"

      - name: Upload Linux build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: |
            *.AppImage
            *.deb
