name: Pake Command Runner (OS + Command)

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Target OS"
        required: true
        default: "macos-latest"
        type: choice
        options:
          - macos-latest
          - windows-latest
          - ubuntu-24.04

      command:
        description: "Paste FULL command (pake or node cli)"
        required: true

jobs:
  run:
    name: Run (${{ inputs.os }})
    runs-on: ${{ inputs.os }}

    steps:
      # -----------------------
      # Checkout (optional but safe)
      # -----------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------
      # Node setup (for CLI builds)
      # -----------------------
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # -----------------------
      # Install PAKE globally (npm ONLY as requested)
      # -----------------------
      - name: Install Pake CLI
        run: npm install -g pake-cli

      # -----------------------
      # Debug
      # -----------------------
      - name: Debug environment
        run: |
          echo "OS: ${{ inputs.os }}"
          node -v
          npm -v
          which pake || echo "pake installed via npm"

      # -----------------------
      # RUN COMMAND
      # -----------------------
      - name: Execute command
        shell: bash
        run: |
          set -e

          echo "Running command:"
          echo "${{ inputs.command }}"

          bash -c "${{ inputs.command }}"
