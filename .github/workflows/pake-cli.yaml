name: Pake Command Runner (OS + Artifact Output)

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Target OS"
        required: true
        default: "macos-latest"
        type: choice
        options:
          - macos-latest
          - windows-latest
          - ubuntu-24.04

      command:
        description: "FULL command (pake or node cli)"
        required: true

jobs:
  build:
    name: Build (${{ inputs.os }})
    runs-on: ${{ inputs.os }}

    steps:
      # -----------------------
      # Checkout (safe default)
      # -----------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------
      # Node.js
      # -----------------------
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # -----------------------
      # Install Pake (npm ONLY)
      # -----------------------
      - name: Install Pake CLI
        run: npm install -g pake-cli

      # -----------------------
      # Debug
      # -----------------------
      - name: Debug environment
        run: |
          node -v
          npm -v
          which pake || echo "pake installed"

      # -----------------------
      # Run build command
      # -----------------------
      - name: Run build command
        shell: bash
        run: |
          set -e

          echo "Running command:"
          echo "${{ inputs.command }}"

          bash -c "${{ inputs.command }}"

      # -----------------------
      # Collect output files
      # -----------------------
      - name: Locate build output
        shell: bash
        run: |
          echo "Searching for build artifacts..."

          find . -maxdepth 3 -type f \( \
            -name "*.dmg" -o \
            -name "*.msi" -o \
            -name "*.AppImage" -o \
            -name "*.deb" \
          \) > artifacts.txt

          echo "Found files:"
          cat artifacts.txt || true

      # -----------------------
      # Upload artifacts (ALL OS)
      # -----------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pake-build-${{ inputs.os }}
          path: |
            *.dmg
            *.msi
            *.AppImage
            *.deb
